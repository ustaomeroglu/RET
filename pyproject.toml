[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ret"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "datasets>=2.16.0",
    "wandb>=0.16.0",
    "pyyaml>=6.0",
    "numpy>=1.26.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "accelerate>=0.25.0",
    "spacy>=3.7",
    "tqdm>=4.60.0",
    "pandas>=1.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]
sae = ["sae-lens>=4.0.0"]
analysis = ["umap-learn>=0.5.0", "anthropic>=0.20.0"]
all = ["ret[dev,sae,analysis]"]

[tool.setuptools]
packages = {find = {}}
