# ==========================================================================
# Pythia-160M Baseline: SAE (EleutherAI/sae-pythia-160m-32k) — TinyStories
# SAE: 32768 latents, k=32, at layer 6 (resid post).
# ==========================================================================

llm:
  name: EleutherAI/pythia-160m
  layer_index: 6
  hidden_dim: 768
  dtype: bfloat16
  trust_remote_code: false
  device_map: null

data:
  mode: document
  local_dir: data/tiny_stories
  hf_dataset: null
  cached_hidden_states_dir: null
  scaffolding: raw
  max_seq_length: 512
  num_workers: 4

logging:
  output_dir: outputs/Pythia160M/tiny_stories/baselines/sae

closure:
  variant: sae
  hidden_dim: [256, 512, 1024, 2048]   # Fig 7 Pythia-160M baseline sweep (2^8-2^11)
  num_layers: 2
  lr: 1.0e-3
  max_steps: 2000
  batch_size: 512
  patience: 10
  val_batches: 5
  eval_every: 200
  llm_batch_size: 16
