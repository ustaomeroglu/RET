# ==========================================================================
# Pythia-160M Baseline: PCA-Projected Hidden States (h_pca128) — TinyStories
# ==========================================================================

llm:
  name: EleutherAI/pythia-160m
  layer_index: 6
  hidden_dim: 768
  dtype: bfloat16
  trust_remote_code: false
  device_map: null

data:
  mode: document
  local_dir: data/tiny_stories
  hf_dataset: null
  cached_hidden_states_dir: null
  scaffolding: raw
  max_seq_length: 512
  num_workers: 4

logging:
  output_dir: outputs/Pythia160M/tiny_stories/baselines/h_pca128

closure:
  variant: h_pca
  pca_dim: 128
  hidden_dim: [256, 512, 1024, 2048]
  num_layers: 2
  lr: 1.0e-3
  max_steps: 4000
  batch_size: 512
  patience: 15
  val_batches: 20
  eval_every: 200
  llm_batch_size: 16
