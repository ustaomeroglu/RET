# ==========================================================================
# Sycophancy Probing — Debate — Qwen3.5 35B (no thinking) — Pooled probes on raw h
# ==========================================================================

experiment: sycophancy

sycophancy:
  data_dir: data/sycophancy/augmented_debate/Qwen3.5-35B-A3B_no_thinking
  layer: 19
  mode: debate
  max_tokens_per_turn: 20

model:
  device: cuda

probe:
  probe_type: linear,dom
  lr: 1.0e-3
  max_epochs: 50
  l2: 1.0e-4
  probe_batch_size: 1024

eval:
  eval_type: within_dataset
  val_ratio: 0.05


logging:
  output_dir: outputs/Qwen3.5-35B-A3B/sycophancy/augmented_debate/baselines/h/probing
