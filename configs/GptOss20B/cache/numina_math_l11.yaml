# Minimal config for caching GPT-OSS-20B hidden states at layer 11 (mid-layer).
# Consumed only by scripts/data_preparation_scripts/cache_hidden_states.py in --config mode.
# Matches andy's resid_post_layer_11 SAE (andyrdt/saes-gpt-oss-20b).

llm:
  name: openai/gpt-oss-20b
  layer_index: 11
  hidden_dim: 2880
  dtype: bfloat16
  trust_remote_code: true
  device_map: auto

data:
  mode: document
  hf_dataset: null
  local_dir: data/numina_math_64k_samples/GptOss20B
  text_field: text
  max_seq_length: 2048
  scaffolding: raw
  num_workers: 4
