# ==========================================================================
# Sycophancy Probing: Sequence probes (attention, transformer) on raw h
# Debate — Qwen2.5 14B, layer 23, hidden_dim=5120
# max_epochs=15 (matches FP seq-probe runs for walltime budget)
# ==========================================================================

experiment: sycophancy

sycophancy:
  data_dir: data/sycophancy/augmented_debate/Qwen2.5-14B-Instruct
  layer: 23
  mode: debate
  max_tokens_per_turn: 20

model:
  device: cuda

probe:
  probe_type: attention,transformer
  lr: 1.0e-3
  max_epochs: 15
  l2: 1.0e-4
  probe_batch_size: 1024

eval:
  eval_type: within_dataset
  val_ratio: 0.05

logging:
  output_dir: outputs/Qwen2.5-14B-Instruct/sycophancy/augmented_debate/baselines/h/probing
