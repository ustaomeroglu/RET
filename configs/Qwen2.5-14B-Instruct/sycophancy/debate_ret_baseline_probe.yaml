# ==========================================================================
# Sycophancy Probing: RET z (unsupervised baseline, z_dim=128, ar=1) — Debate
# ==========================================================================

experiment: sycophancy

sycophancy:
  data_dir: data/sycophancy/augmented_debate/Qwen2.5-14B-Instruct
  layer: 23
  mode: debate
  max_tokens_per_turn: 20

model:
  device: cuda

probe:
  probe_type: linear,dom
  lr: 1.0e-3
  max_epochs: 50
  l2: 1.0e-4
  probe_batch_size: 1024

eval:
  eval_type: within_dataset
  val_ratio: 0.05

ret:
  checkpoint_path: outputs/Qwen2.5-14B-Instruct/sycophancy/augmented_debate/ret_jepa_baseline/checkpoint_final.pt

logging:
  output_dir: outputs/Qwen2.5-14B-Instruct/sycophancy/augmented_debate/ret_jepa_baseline/probing
